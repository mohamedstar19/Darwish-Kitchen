# Darwish Kitchen — kitchen.darwish-tech.com
# Behind Cloudflare (SSL at the edge), same pattern as quran.darwish-tech.com.
server {
    listen 80;
    server_name kitchen.darwish-tech.com;

    root /opt/darwish-kitchen/web;
    index index.html;

    access_log /var/log/nginx/kitchen.access.log;
    error_log  /var/log/nginx/kitchen.error.log;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Backup API (Node, PM2 "kitchen"). Backups can carry many photos.
    location /api/ {
        client_max_body_size 12M;
        proxy_pass http://127.0.0.1:3020;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header CF-Connecting-IP  $http_cf_connecting_ip;
        proxy_read_timeout 120s; # AI search answers within ~25 s and the app polls
    }

    # Hashed JS/font bundles never change.
    location /_expo/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Web app (installable on iPhone); unknown paths open the app.
    location / {
        try_files $uri /index.html;
    }
}
